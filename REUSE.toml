SPDX-PackageDownloadLocation = "https://gitlab.archlinux.org/archlinux/buildbtw"
SPDX-PackageName = "buildbtw"
SPDX-PackageSupplier = "Arch Linux"
version = 1

[[annotations]]
SPDX-FileCopyrightText = "buildbtw Contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
path = ["**.sh", "**.rs", "**.jinja", "**.sql", "**.css", "**.js", "**.html"]

[[annotations]]
SPDX-FileCopyrightText = "buildbtw Contributors"
SPDX-License-Identifier = "0BSD"
path = [
    "**/Containerfile",
    ".editorconfig",
    "**.git",
    "**.gitattributes",
    "**.toml",
    "**.json",
    "*.lock",
    "**.sqlite",
    "**.graphql",
    "**.json",
    "**.yml",
    ".env*",
    ".gitignore",
    ".gitmodules",
    ".gitlab/**",
    "**/Justfile",
    "tests/**/*.snap",
]

[[annotations]]
SPDX-FileCopyrightText = "buildbtw Contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"
path = ["**.md", "notes/**", "docs/**.svg"]
precedence = "aggregate"

[[annotations]]
SPDX-FileCopyrightText = "common-style Contributors"
SPDX-License-Identifier = "MIT"
path = ["common-style/**"]

[[annotations]]
SPDX-FileCopyrightText = "Star Federation"
SPDX-License-Identifier = "MIT"
path = ["assets/vendor/datastar/**"]

[[annotations]]
SPDX-FileCopyrightText = "2023 Jeremy Thomas"
SPDX-License-Identifier = "MIT"
path = ["assets/vendor/bulma/**"]

[[annotations]]
SPDX-FileCopyrightText = "2026 Fonticons, Inc."
SPDX-License-Identifier = "MIT"
path = ["assets/vendor/fontawesome/css/**"]

[[annotations]]
SPDX-FileCopyrightText = "2026 Fonticons, Inc."
SPDX-License-Identifier = "OFL-1.1"
path = ["assets/vendor/fontawesome/webfonts/**"]
