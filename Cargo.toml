[package]
name = "buildbtw"
version = "0.0.1"
description = "A service for assisting Arch Linux staff with building new versions of packages"
authors = [
    "Levente Polyak <anthraxx@archlinux.org>",
    "Rafael Epplée <raffomania@archlinux.org>",
    "Sven-Hendrik Haase <svenstaro@archlinux.org>",
]
edition = "2024"
homepage = "https://gitlab.archlinux.org/archlinux/buildbtw"
keywords = ["arch", "linux", "packaging", "archlinux", "ci"]
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://gitlab.archlinux.org/archlinux/buildbtw"
publish = false

[profile.release]
codegen-units = 1
lto = true
debug = true

# Lints that are "warn" will be fine in development,
# but the CI will reject them.
# "forbid" cannot be overridden, e.g. with an inline comment.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[dependencies]
alpm-srcinfo = "0.4.0"
alpm-types = "0.8.0"
clap = { version = "4.5.42", features = [
    "cargo",
    "derive",
    "env",
    "wrap_help",
] }
color-eyre = "0.6"
console-subscriber = "0.4.1"
directories = "6.0.0"
gitlab = "0.1804.0"
redact = "0.1.11"
reqwest = { version = "0.12.22", features = [
    "json",
    "stream",
    "rustls-tls",
], default-features = false }
serde = { version = "1.0.219", features = ["serde_derive"] }
serde_json = { version = "1.0.141", features = ["raw_value"] }
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.47.0", features = [
    "fs",
    "macros",
    "process",
    "rt-multi-thread",
    "tracing",
    "signal",
] }
toml = "0.9.4"
time = { version = "0.3.41", features = ["formatting", "parsing", "serde"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = "2.5.4"
sea-orm = { version = "1.1.14", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-time",
    "with-json",
    "with-uuid",
    "debug-print",
], default-features = false }
sea-orm-migration = { version = "1.1.14", features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
], default-features = false }
camino = "1.1.11"
axum = { version = "0.8.4", features = [
    "macros",
    "tracing",
    "tokio",
    "json",
    "query",
    "http1",
    "http2",
], default-features = false }
tower-http = { version = "0.6.6", features = [
    "timeout",
], default-features = false }
axum-extra = { version = "0.10.1", features = [
    "typed-routing",
    "cookie-private",
] }
uuid = { version = "1.18.0", features = ["v4", "serde"] }
nutype = { version = "0.6.2", features = ["derive_unsafe", "serde", "regex"] }
regex = "1.11.2"
openidconnect = { version = "4.0.1", features = [
    "timing-resistant-secret-traits",
] }
garde = { version = "0.22.0", features = ["derive"] }

[dev-dependencies]
axum-test = { version = "18.1.0", features = ["typed-routing"] }
thirtyfour = { version = "0.36.1", features = [
    "rustls-tls",
], default-features = false }
rstest = { version = "0.26.1", default-features = false }
cookie = "0.18.1"
