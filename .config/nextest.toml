[profile.default]
slow-timeout = { period = "2s", terminate-after = 2 }
# Don't fail fast so all insta snapshots update.
fail-fast = false

[test-groups]
e2e = { max-threads = 1 }

[[profile.default.overrides]]
# end-to-end tests depend on geckodriver which is currently always spawned on the same port,
# and they need to bind the buildbtw server to an actual port, which is currently hardcoded
filter = 'test(e2e)'
test-group = 'e2e'
slow-timeout = { period = "20s", terminate-after = 2 }

[[profile.default.overrides]]
# run_local tests invoke vmexec to build a real package inside a VM, which
# takes far longer than the default 4s timeout.
filter = 'test(run_local)'
slow-timeout = { period = "60s", terminate-after = 2 }
